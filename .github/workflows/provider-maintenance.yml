name: Daily Provider Maintenance

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-provider-maintenance
  cancel-in-progress: true

jobs:
  monitor-providers:
    name: Monitor upstream providers and validate addon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out NuvioStreams
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax in NuvioStreams
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done
          echo "All ${#files[@]} JavaScript files passed syntax checks."

      - name: Check upstream repositories for recent provider changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const headers = {
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'NuvioStreams-Daily-Monitor',
            ...(process.env.GH_TOKEN ? { 'Authorization': `Bearer ${process.env.GH_TOKEN}` } : {})
          };

          async function api(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${url}`);
            return response.json();
          }

          async function inspectRepo(fullName) {
            const meta = await api(`https://api.github.com/repos/${fullName}`);
            const branch = meta.default_branch;
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const commits = await api(`https://api.github.com/repos/${fullName}/commits?sha=${encodeURIComponent(branch)}&since=${encodeURIComponent(since)}&per_page=50`);
            const tree = await api(`https://api.github.com/repos/${fullName}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
            const providerFiles = (tree.tree || [])
              .filter(item => item.type === 'blob' && /(^|\/)(providers?|plugins?)\//i.test(item.path) && /\.(js|cjs|mjs|ts)$/i.test(item.path))
              .map(item => item.path);
            const changed = new Set();
            for (const commit of commits) {
              const detail = await api(`https://api.github.com/repos/${fullName}/commits/${commit.sha}`);
              for (const file of detail.files || []) {
                if (/provider|plugin/i.test(file.filename)) changed.add(file.filename);
              }
            }
            return {
              name: fullName,
              url: meta.html_url,
              branch,
              latestCommit: meta.pushed_at,
              commitsLast24h: commits.length,
              providerFileCount: providerFiles.length,
              changedProviderFiles: [...changed].slice(0, 40),
              truncatedTree: Boolean(tree.truncated),
              license: meta.license?.spdx_id || 'Not specified by GitHub'
            };
          }

          (async () => {
            const sources = [];
            sources.push(await inspectRepo('itsmeadarsh2008/Streamline'));

            const ownerRepos = await api('https://api.github.com/users/TicoLibre/repos?per_page=100&sort=updated');
            const zero = ownerRepos.find(repo => /nuvio/i.test(repo.name) && /zero/i.test(repo.name));
            if (zero) {
              sources.push(await inspectRepo(zero.full_name));
            } else {
              sources.push({
                name: 'TicoLibre Nuvio Zero',
                url: 'https://github.com/TicoLibre',
                warning: 'Could not identify a repository whose name contains both Nuvio and Zero. Verify the upstream repository manually.'
              });
            }

            const lines = [
              '## Daily provider maintenance report',
              '',
              'This is a free monitoring run. It does not import, modify, or repair provider code.',
              '',
              '| Source | Commits in last 24h | Provider files found | License |',
              '|---|---:|---:|---|',
              ...sources.map(s => `| [${s.name}](${s.url}) | ${s.commitsLast24h ?? '—'} | ${s.providerFileCount ?? '—'} | ${s.license ?? '—'} |`),
              '',
              '### Recent provider/plugin file changes',
              ...sources.map(s => {
                const changes = s.changedProviderFiles?.length
                  ? s.changedProviderFiles.map(f => `- \`${f}\``).join('\n')
                  : '- No provider/plugin-named file changes detected in commits from the last 24 hours.';
                return `**${s.name}**\n\n${s.warning ? `⚠️ ${s.warning}\n\n` : ''}${changes}`;
              }),
              '',
              '### Safety notes',
              '- Upstream files are inspected as metadata only; they are not executed or copied.',
              '- A provider filename or commit does not prove that a provider works or is compatible.',
              '- Review upstream licenses and architecture before manually adapting any code.',
              '- Existing NuvioStreams providers and production files are not changed by this workflow.'
            ];

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            fs.writeFileSync('upstream-provider-report.json', JSON.stringify(sources, null, 2));
          })().catch(error => {
            console.error(error);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Upstream check error\n\n${error.message}\n`);
            process.exitCode = 1;
          });
          NODE

      - name: Upload upstream report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-provider-report
          path: upstream-provider-report.json
          if-no-files-found: ignore
          retention-days: 14
